services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: orquestrator
      POSTGRES_DB: orquestrator
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configurar POSTGRES_PASSWORD}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U orquestrator -d orquestrator']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  orchestrator:
    build: .
    environment:
      DATABASE_URL: postgres://orquestrator:${POSTGRES_PASSWORD:?Configurar POSTGRES_PASSWORD}@postgres:5432/orquestrator
      ORCHESTRATOR_TOKEN: ${ORCHESTRATOR_TOKEN:?Configurar ORCHESTRATOR_TOKEN}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-}
      MODEL_NAME: ${MODEL_NAME:-}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
    ports:
      - '127.0.0.1:${PORT:-3000}:3000'
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 1g
    cpus: 2
    pids_limit: 128
    healthcheck:
      test: [CMD, node, -e, 'fetch("http://127.0.0.1:3000/api/v1/health/live").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))']
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
volumes:
  database:
